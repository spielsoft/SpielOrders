[package]
name = "spielorders-core"
description = "Platform-independent boundary for SpielOrders domain capabilities"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
# The integration tests are one target, declared below, rather than one per file.
# A new tests/<name>.rs is only run once `mod <name>;` is added to tests/main.rs.
autotests = false

[lib]
path = "src/lib.rs"

[[test]]
name = "core"
path = "tests/main.rs"

[dependencies]
focaccia = "2.6.0"
# String-producing Unicode folds for substring search; focaccia compares whole names.
icu_casemap = "2.4.0"
# A CommonMark parser, which is how a search reads a README's text rather than the
# Markdown it is written in. The default features are the crate's HTML renderer and its
# binary's argument parsing, and neither is wanted. See `src/search.rs`.
pulldown-cmark = { version = "0.13.6", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.8"
# Canonical decomposition, which is how a search folds a diacritic away without
# transliterating the text it is folding. See `src/search.rs`.
unicode-normalization = "0.1.26"

[dev-dependencies]
libc = "0.2.191"
