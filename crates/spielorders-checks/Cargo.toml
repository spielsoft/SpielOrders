[package]
name = "spielorders-checks"
description = "Repository contract and documentation checks"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
# Generates the interface header from the Rust source, which is how the gate keeps the
# committed header current.
cbindgen = { version = "0.29.4", default-features = false }
jsonschema = { version = "0.60.2", default-features = false }
pulldown-cmark = { version = "0.13.6", default-features = false }
serde_json = "1.0.154"
