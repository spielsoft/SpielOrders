[package]
name = "spielorders-cli"
description = "Command-line adapter for SpielOrders"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
# The integration tests are one target, declared below, rather than one per file, for
# the same reason the library keeps one test module tree: the suite links once. A new
# `tests/<name>.rs` is only compiled and run once `mod <name>;` is added to
# `tests/main.rs`. See `docs/development/test-loop.md`.
autotests = false

[[bin]]
name = "spielorders"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# Local timestamp rendering in the human-output adapter.
jiff = "0.2.39"
# The document keeps its members in the order this executable builds them.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
spielorders.workspace = true

# The CLI's own Trash move is the platform's request to trash an item, and its Spotlight
# query asks the volume a directory is on.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSError",
  "NSFileManager",
  "NSString",
  "NSURL",
] }
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
uuid = { version = "1.29.0", features = ["v4"] }
