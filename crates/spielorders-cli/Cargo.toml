[package]
name = "spielorders-cli"
description = "Command-line adapter for SpielOrders"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
# The integration tests are one target, declared below, rather than one per file, for
# the same reason `spielorders-core` does it: the suite links once. A new
# `tests/<name>.rs` is only compiled and run once `mod <name>;` is added to
# `tests/main.rs`. See `docs/development/test-loop.md`.
autotests = false

[lib]
name = "spielorders_cli"
path = "src/lib.rs"

[[bin]]
name = "spielorders"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# The user's current local calendar date, which `LocalCalendar` is the whole of. A local
# date needs the platform's time-zone database, which `std` does not expose. See
# `src/effects.rs`.
jiff = "0.2.39"
# The exclusive directory rename `DirectoryFileSystem::rename_new_directory` promises
# has no `std` spelling. See `src/effects.rs`.
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spielorders-core.workspace = true
# The opaque identities `UuidGenerator` supplies. Version 4 is randomness alone, so the
# platform's own generator is the whole of the effect. See `src/effects.rs`.
uuid = { version = "1.29.0", features = ["v4"] }

# The platform request to trash an item, which `NativeTrash` is the whole of and which
# `std` does not expose. Apple-only because the request is: a platform this build cannot
# ask refuses rather than deleting anything. See `src/effects.rs`.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSError",
  "NSFileManager",
  "NSString",
  "NSURL",
] }
