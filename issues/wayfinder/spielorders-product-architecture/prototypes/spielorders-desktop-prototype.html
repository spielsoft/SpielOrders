  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input:checked {

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

    center / 100% 2px no-repeat;

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],

  ) {

}

.btn:focus-visible {

}

svg {

  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {

}

        { id:&#x27;damaged&#x27;, date:&#x27;2026-06-25&#x27;, status:&#x27;&#x27;, title:&#x27;2026_06_25_Old_objective_lenses&#x27;, directory:&#x27;2026_06_25_Old_objective_lenses&#x27;, vendor:&#x27;&#x27;, orderer:&#x27;&#x27;, institution:&#x27;&#x27;, project:&#x27;&#x27;, group:&#x27;&#x27;, currency:&#x27;USD&#x27;, readme:&#x27;&#x27;, items:[], damaged:true, diagnostic:&#x27;Damaged Order: order.json is malformed. Canonical facts cannot be trusted.&#x27; }
      ];
      const spotlight = [{order:&#x27;Laser components&#x27;,file:&#x27;quotes/Tarnwick-revised-quote.pdf&#x27;,kind:&#x27;PDF&#x27;,modified:&#x27;2026-07-18&#x27;},{order:&#x27;Laser components&#x27;,file:&#x27;correspondence/approval.eml&#x27;,kind:&#x27;Mail&#x27;,modified:&#x27;2026-07-17&#x27;},{order:&#x27;Optical mounts and posts&#x27;,file:&#x27;drawings/mount-layout.dwg&#x27;,kind:&#x27;Drawing&#x27;,modified:&#x27;2026-07-15&#x27;}];
      let selectedId = rows[0].id;
      let caseSensitive = false;
      let totalOrders = 1247;
      let newDraft = false;
      const query = root.querySelector(&#x27;#so-query&#x27;);
      const orderBody = root.querySelector(&#x27;#so-orders-body&#x27;);
      const rowMenu = root.querySelector(&#x27;#so-row-menu&#x27;);

      const selected = () =&gt; rows.find(row =&gt; row.id === selectedId) || rows[0];
      const directoryName = row =&gt; {
        if (row.directory) return row.directory;
        const normalize = value =&gt; value.trim().replace(/[^A-Za-z0-9_]+/g,&#x27;_&#x27;).replace(/_+/g,&#x27;_&#x27;).replace(/^_+|_+$/g,&#x27;&#x27;);
        const parts = [row.date.replaceAll(&#x27;-&#x27;,&#x27;_&#x27;)];

        if (row.orderer) parts.push(normalize(row.orderer));
        return parts.filter(Boolean).join(&#x27;_&#x27;);
      };
