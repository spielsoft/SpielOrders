[workspace]
members = [
  "crates/spielorders",
  "crates/spielorders-cli",
  "crates/spielorders-checks",
]
default-members = ["crates/spielorders", "crates/spielorders-cli", "crates/spielorders-checks"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99.1"
version = "0.1.1"

[workspace.dependencies]
spielorders = { path = "crates/spielorders" }

[profile.test]
# Chosen on measurement rather than preference: line tables cut `target/debug/deps`
# without costing a backtrace its `file:line`.
debug = "line-tables-only"
