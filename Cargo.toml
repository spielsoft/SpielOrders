[workspace]
members = [
  "crates/spielorders-core",
  "crates/spielorders-cli",
  "apps/desktop/src-tauri",
]
default-members = ["crates/spielorders-core", "crates/spielorders-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98.1"
version = "0.1.0"

[workspace.dependencies]
spielorders-core = { path = "crates/spielorders-core" }

[profile.test]
# Chosen on measurement rather than preference: line tables cut `target/debug/deps`
# without costing a backtrace its `file:line`. See `docs/development/test-loop.md`.
debug = "line-tables-only"
